gui:
  commitLength:
    show: true
  showFileTree: true
  splitDiff: auto

  theme:
    activeBorderColor:
      - "#ff966c"
      - "bold"
    inactiveBorderColor:
      - "#589ed7"
    searchingActiveBorderColor:
      - "#ff966c"
      - "bold"
    optionsTextColor:
      - "#82aaff"
    selectedLineBgColor:
      - "#2d3f76"
    cherryPickedCommitFgColor:
      - "#82aaff"
    cherryPickedCommitBgColor:
      - "#c099ff"
    markedBaseCommitFgColor:
      - "#82aaff"
    markedBaseCommitBgColor:
      - "#ffc777"
    unstagedChangesColor:
      - "#c53b53"
    defaultFgColor:
      - "#c8d3f5"

  # authorColors:
  #   "*": "#b4befe"

customCommands:
  - key: "b"
    command: "gh browse"
    context: "files"
    description: "Open repo in browser"
  - key: "b"
    command: 'gh browse "{{.SelectedLocalCommit.Sha}}"'
    context: "commits"
    description: "Open commit in browser"
  - key: "P"
    command: "git push --no-verify --force-with-lease"
    context: "global"
    loadingText: "Pushing..."
    description: "Force push with --no-verify"
